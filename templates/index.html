<!DOCTYPE html>
<html>
<head>
    <title>Live Earphone Translator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; text-align: center; }
        #chat-box { border: 1px solid #ccc; height: 350px; overflow-y: scroll; padding: 10px; margin-bottom: 20px; text-align: left; }
        .message { margin-bottom: 15px; padding: 10px; border-radius: 5px; background: #f0f0f0; }
        select { padding: 10px; font-size: 16px; margin-bottom: 20px; }
        #liveBtn { 
            padding: 15px 30px; 
            font-size: 18px; 
            cursor: pointer; 
            border: none; 
            border-radius: 50px; 
            background: #28a745; 
            color: white; 
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        #liveBtn.active { background: #dc3545; }
        #status { margin-top: 10px; font-style: italic; color: #666; }
    </style>
</head>
<body>

    <h2>Live Earphone Translator 🎧</h2>
    
    <label>My Language: </label>
    <select id="myLanguage" onchange="updateLanguage()">
        <option value="tl">Tagalog</option>
        <option value="ne">Nepali</option>
    </select>

    <div id="chat-box"></div>

    <button id="liveBtn" onclick="toggleConversation()">🎙️ Start Conversation</button>
    <div id="status">Microphone is off</div>

    <script>
        const socket = io();
        let isConversing = false;
        let recognition = null;

        // Initialize Speech Recognition
        if (window.hasOwnProperty('webkitSpeechRecognition') || window.hasOwnProperty('SpeechRecognition')) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            
            // Setting continuous to true lets it capture multiple sentences
            recognition.continuous = true; 
            recognition.interimResults = false;

            recognition.onstart = function() {
                document.getElementById('status').innerText = "Listening... speak naturally.";
            };

            recognition.onresult = function(event) {
                // Get the most recent completed sentence
                const current = event.resultIndex;
                const transcript = event.results[current][0].transcript;
                
                const lang = document.getElementById('myLanguage').value;
                
                // Send it to the server immediately
                socket.emit('send_message', { text: transcript, lang: lang });
            };

            // Browsers often auto-stop the mic when silent. This forces it back on if they are still talking.
            recognition.onend = function() {
                if (isConversing) {
                    recognition.start();
                } else {
                    document.getElementById('status').innerText = "Microphone is off.";
                }
            };

            recognition.onerror = function(event) {
                console.error("Mic error:", event.error);
                if (event.error === 'not-allowed') {
                    alert("Please allow microphone access in your browser settings.");
                    toggleConversation(); // Turn off visually
                }
            };
        } else {
            alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
        }

        function updateLanguage() {
            if (recognition) {
                const lang = document.getElementById('myLanguage').value;
                recognition.lang = lang === 'tl' ? 'tl-PH' : 'ne-NP';
                // Restart mic to apply new language if currently running
                if (isConversing) {
                    recognition.stop(); 
                }
            }
        }

        function toggleConversation() {
            if (!recognition) return;

            const btn = document.getElementById('liveBtn');
            isConversing = !isConversing;

            if (isConversing) {
                updateLanguage(); // Ensure correct language is set
                recognition.start();
                btn.innerText = "🛑 End Conversation";
                btn.classList.add('active');
            } else {
                recognition.stop();
                btn.innerText = "🎙️ Start Conversation";
                btn.classList.remove('active');
            }
        }

        socket.on('receive_message', function(data) {
            const chatBox = document.getElementById('chat-box');
            const myLang = document.getElementById('myLanguage').value;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `
                <strong>${data.sender_lang.toUpperCase()}:</strong> ${data.original} <br>
                <strong>${data.target_lang.toUpperCase()}:</strong> ${data.translated}
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Only play the audio if it's meant for this person
            if (data.target_lang === myLang) {
                const audio = new Audio("data:audio/mp3;base64," + data.audio_data);
                audio.play();
            }
        });
    </script>
</body>
</html>
